<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Productos</title>
  <link rel="stylesheet" href="Style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Catálogo de Productos</h1>
    <p class="subtitle">Datos obtenidos desde una API pública (fetch)</p>
  </header>

  <main class="container">
    <section class="controls">
      <input
        type="text"
        id="searchInput"
        placeholder="Buscar producto por nombre..."
        aria-label="Buscar producto"
      />

      <select id="categoryFilter" aria-label="Filtrar por categoría">
        <option value="all">Todas las categorías</option>
      </select>

      <button id="reloadBtn" type="button">Recargar datos</button>
    </section>

    <p id="status" class="status"></p>

    <section id="productList" class="product-grid"></section>
  </main>

  <footer class="app-footer">
    <p>Proyecto de práctica — consumo de API con fetch(), DOM e interacción básica.</p>
  </footer>

  <script src="Script.js"></script>
</body>
</html>
